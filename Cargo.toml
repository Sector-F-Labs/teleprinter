[package]
name = "teleprinter"
version = "0.1.0"
edition = "2024"
description = "A terminal emulator on egui and Patina, with alacritty_terminal doing the emulation"
license = "BSD-3-Clause"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
dirs = "7.0.0"
eframe = "0.35"
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.190"
patina-ui = { git = "https://github.com/Sector-F-Labs/patina", branch = "develop" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ttf-parser = "0.25.1"

[dev-dependencies]
resvg = "0.48.1"
